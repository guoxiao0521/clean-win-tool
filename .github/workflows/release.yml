name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          CI: false
          SKIP_NOTARIZATION: true
        run: npm run build:win:ci

      - name: Verify build output
        run: |
          if (Test-Path "dist\*.exe") {
            Get-ChildItem dist\*.exe | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          } else {
            Write-Host "No .exe files found in dist directory"
            Get-ChildItem dist -Recurse | Select-Object FullName
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

